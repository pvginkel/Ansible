# /etc/iac/secrets.yaml — operator-curated, hand-edited on srviac.
# Never committed to git. Mode 0600, owner root.
#
# This file is the placeholder. On a fresh srviac the iac_agent role
# drops a copy of it at /etc/iac/secrets.example.yaml and fails loudly
# until the operator copies it to /etc/iac/secrets.yaml and fills in
# the real values.
#
# Two top-level lists:
#   env:   exported as environment variables in every iac container.
#   files: written into the container's filesystem at `path` with `mode`.
# `mode` is required on each files: entry (no default).
#
# Values resolve in one of two ways:
#
#   1. **Literal** — plain string, used verbatim.
#   2. **!bao mount/path#key** — a YAML custom tag resolved at iac
#      container startup against OpenBao. `mount` is the KV-v2 mount
#      (`kv` for the canonical homelab mount), `path` is the secret's
#      logical path under it, `#key` is the field within that secret.
#      The iac-agent AppRole's policy must grant `read` on the path.
#
# **Irreducible-literal set** — the four entries below MUST be
# literals. They gate the path that fetches every other secret, so a
# !bao on any of them is a hard error. See
# /work/Ansible/docs/runbooks/iac-cold-boot.md when OpenBao is
# unreachable.

env:
  # ----- irreducible literals -----------------------------------------

  # OpenBao endpoint. Reaches the leader via the keepalived VIP
  # (HAProxy port-fronts 443 → 8200, TCP pass-through).
  - name: OPENBAO_URL
    value: https://secrets.home/

  # iac-agent AppRole credentials. Provisioned by the `openbao` role
  # (Ansible card #40); printed once at apply time with
  # `-e openbao_rotate_secret_ids=true`. Rotation procedure: mint a
  # fresh secret_id in OpenBao, paste here, restart the iac container.
  - name: OPENBAO_ROLE_ID
    value: REPLACE_ME
  - name: OPENBAO_SECRET_ID
    value: REPLACE_ME

  # GitHub PAT used by iac-impl to clone and push pvginkel/TerraformState.
  # Scope: `repo` on a classic PAT, or `Contents: Read and write` on a
  # fine-grained PAT scoped to TerraformState. Cannot become a !bao ref
  # because OpenBao access depends on a successful clone of
  # pvginkel/Ansible (lockfile freshness check + iac-impl venv).
  - name: GIT_API_TOKEN
    value: ghp_REPLACE_ME

  # ----- resolved from OpenBao ----------------------------------------
  #
  # Each entry below is the post-migration shape; during the per-ref
  # rollout in card #15 these can still be literals. Switching a ref
  # to OpenBao is a two-step change: write the secret under the
  # documented KV path, AND extend `openbao_iac_agent_kv_paths` in
  # inventories/prd/group_vars/openbao.yml to grant `read` on that
  # path. Mismatches hard-fail at next iac startup.

  # Home Assistant endpoint + long-lived access token. Used by
  # send_message.py (push notifications from Jenkins post-stages).
  - name: HA_URL
    value: !bao kv/iac/home-assistant#url
  - name: HA_TOKEN
    value: !bao kv/iac/home-assistant#token

  # Jenkins inbound-agent secret. Read by jenkins-agent-launch.sh at
  # start time; visible to the systemd unit only through that wrapper.
  - name: JENKINS_AGENT_SECRET
    value: !bao kv/iac/jenkins-agent#secret

  # Terraform provider credentials. iac-impl exports these as TF_VAR_*
  # so terraform.tfvars doesn't need to exist inside the container.
  - name: TF_VAR_proxmox_endpoint
    value: https://pve.home:8006/
  - name: TF_VAR_proxmox_username
    value: root@pam
  - name: TF_VAR_proxmox_password
    value: !bao kv/iac/terraform-proxmox#password
  - name: TF_VAR_proxmox_insecure
    value: "true"
  - name: TF_VAR_dns_reservation_url
    value: https://dns-reservation.home/
  - name: TF_VAR_dns_reservation_token
    value: !bao kv/iac/terraform-dns-reservation#token

files:
  # Ansible SSH private key — same identity as the operator workstation
  # uses today; private half lives in OpenBao (and historically the
  # cloud-synced attachments folder). The public half is committed
  # under ansible/roles/bootstrap/files/ansible.pub.
  - path: /root/.ssh/id_ed25519_ansible
    content: !bao kv/iac/ansible-ssh-key#private
    mode: "0600"
