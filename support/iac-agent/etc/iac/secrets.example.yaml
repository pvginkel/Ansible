# /etc/iac/secrets.yaml — operator-curated, hand-edited on srviac.
# Never committed to git. Mode 0600, owner root.
#
# This file is the placeholder. On a fresh srviac the iac_agent role
# drops a copy of it at /etc/iac/secrets.example.yaml and fails loudly
# until the operator copies it to /etc/iac/secrets.yaml and fills in
# the real values.
#
# Two top-level lists:
#   env:   exported as environment variables in every iac container.
#   files: written into the container's filesystem at `path` with `mode`.
# `mode` is required on each files: entry (no default).
#
# Values resolve in one of two ways:
#
#   1. **Literal** — plain string, used verbatim.
#   2. **!bao mount/path#key** — a YAML custom tag resolved at iac
#      container startup against OpenBao. `mount` is the KV-v2 mount
#      (`kv` for the canonical homelab mount), `path` is the secret's
#      logical path under it, `#key` is the field within that secret.
#      The iac-agent AppRole's policy must grant `read` on the path —
#      see `openbao_iac_agent_kv_paths` in
#      /work/Ansible/inventories/prd/group_vars/openbao.yml.
#
# **Irreducible-literal set** — the entries marked below MUST be
# literals. They either gate the path that fetches every other secret
# (OPENBAO_*, GIT_API_TOKEN), feed Ansible before any iac-impl !bao
# resolution can happen (ANSIBLE_VAULT_PASSWORD_FILE points at a file
# whose content decrypts vaulted group_vars), or are consumed by a
# host-side script outside iac-impl entirely (JENKINS_AGENT_SECRET, read
# by jenkins-agent-launch.sh, which has no OpenBao resolver). See
# /work/Ansible/docs/runbooks/iac-cold-boot.md when OpenBao is
# unreachable.

env:
  # ----- irreducible literals -----------------------------------------

  # OpenBao endpoint. Reaches the leader via the keepalived VIP
  # (HAProxy port-fronts 443 → 8200, TCP pass-through).
  - name: OPENBAO_URL
    value: https://secrets.home/

  # iac-agent AppRole credentials. Provisioned by the `openbao` role
  # (Ansible card #40); printed once at apply time with
  # `-e openbao_rotate_secret_ids=true`. Rotation procedure: mint a
  # fresh secret_id in OpenBao, paste here, restart the iac container.
  - name: OPENBAO_ROLE_ID
    value: REPLACE_ME
  - name: OPENBAO_SECRET_ID
    value: REPLACE_ME

  # GitHub PAT used by iac-impl to clone and push pvginkel/TerraformState.
  # Scope: `repo` on a classic PAT, or `Contents: Read and write` on a
  # fine-grained PAT scoped to TerraformState. Cannot become a !bao ref
  # because OpenBao access depends on a successful clone of
  # pvginkel/Ansible (lockfile freshness check + iac-impl venv).
  - name: GIT_API_TOKEN
    value: ghp_REPLACE_ME

  # Ansible vault passphrase file. Materialised by the `files:` entry
  # below. iac-impl exports the path; Ansible reads the file when it
  # decrypts vaulted group_vars (openbao-admin AppRole creds,
  # vrrp_auth_password, internal_tls_jwk_provisioner_password). The
  # passphrase value lives in the files block, not OpenBao — Ansible
  # needs it before any !bao resolution against vaulted inventory.
  - name: ANSIBLE_VAULT_PASSWORD_FILE
    value: /etc/iac/ansible_vault_pass

  # Jenkins inbound-agent secret. MUST be a literal — NOT a !bao ref.
  # jenkins-agent-launch.sh reads it on the host via systemd (raw yq, no
  # OpenBao resolver), and the agent must connect at cold boot when
  # OpenBao is down. A !bao ref here is handed to the controller verbatim
  # and rejected as an incorrect secret. The controller's "IaC Agent"
  # node page shows the value. Rotate: regenerate there, paste here,
  # `systemctl restart jenkins-agent`.
  - name: JENKINS_AGENT_SECRET
    value: REPLACE_ME

  # ----- non-secret config (URLs / usernames / flags) -----------------
  #
  # URLs and similar identifiers are not in OpenBao per the
  # "URLs never enter Vault" decision. They stay literal here.

  - name: HA_URL
    value: https://homeassistant.webathome.org

  - name: TF_VAR_proxmox_endpoint
    value: https://pve:8006/
  - name: TF_VAR_proxmox_username
    value: root@pam
  - name: TF_VAR_proxmox_insecure
    value: "true"

  - name: TF_VAR_dns_reservation_url
    value: http://dns/

  - name: TF_VAR_backup_server_url
    value: https://backup-server/

  # Git identity for terraform-backend-git's BasicAuth to GitHub.
  # GITHUB_TOKEN is mapped from GIT_API_TOKEN by iac-impl, so it isn't
  # repeated here; GIT_USERNAME is any non-empty string GitHub accepts
  # alongside a PAT.
  - name: GIT_USERNAME
    value: x-access-token

  # State-at-rest encryption. terraform-backend-git encrypts every
  # tfstate with sops+age before pushing to TerraformState. The
  # recipient is the age *public* key (not secret); the private half is
  # SOPS_AGE_KEY below. Manual-decrypt steps: TerraformState/README.md.
  - name: TF_BACKEND_HTTP_ENCRYPTION_PROVIDER
    value: sops
  - name: TF_BACKEND_HTTP_SOPS_AGE_RECIPIENTS
    value: age1REPLACE_ME

  # ----- resolved from OpenBao ----------------------------------------
  #
  # Each ref below requires the leaf to exist in OpenBao AND the path
  # to be granted by `openbao_iac_agent_kv_paths`. Both must be in
  # place before this file references the leaf; mismatches hard-fail
  # at next iac startup.

  # Home Assistant long-lived token. Minted distinct from the one the
  # homeassistant-mcp chart uses — see decisions.md
  # §Per-consumer named accounts.
  - name: HA_TOKEN
    value: !bao kv/iac/homeassistant#token

  # bpg/proxmox provider credentials.
  - name: TF_VAR_proxmox_password
    value: !bao kv/iac/proxmox#password

  # homelab_dns_reservation provider API token.
  - name: TF_VAR_dns_reservation_token
    value: !bao kv/iac/dns-reservation#token

  # homelab_backup_credential provider upload token.
  - name: TF_VAR_backup_server_token
    value: !bao kv/iac/backup-server#token

  # age private key terraform-backend-git decrypts state with. Safe as
  # a !bao ref: it isn't needed to clone (the clone uses GIT_API_TOKEN),
  # only to read/write state, which happens after OpenBao resolution.
  - name: SOPS_AGE_KEY
    value: !bao kv/iac/tf-backend#age_secret_key

files:
  # Ansible SSH private key — same identity as the operator workstation
  # uses today. The public half is committed under
  # ansible/roles/bootstrap/files/ansible.pub.
  - path: /root/.ssh/id_ed25519_ansible
    content: !bao kv/iac/ansible-ssh-key#private
    mode: "0600"

  # Ansible vault passphrase. Decrypts vaulted values in group_vars
  # (openbao-admin AppRole creds, vrrp_auth_password,
  # internal_tls_jwk_provisioner_password). Stays literal because
  # Ansible reads it before any !bao reference in vaulted inventory
  # could resolve.
  - path: /etc/iac/ansible_vault_pass
    content: REPLACE_ME
    mode: "0644"
