---
# The IaCAgent tree, in this repo. The role syncs it onto the target host
# and runs its install.sh. Path is relative to the playbook
# (ansible/playbooks/), so it resolves against whichever checkout is being
# applied from — the operator's /work/Ansible and the clone iac-impl makes
# inside the iac container alike. No sibling checkout is consulted.
iac_agent_local_checkout: "{{ playbook_dir }}/../../support/iac-agent"

# Where IaCAgent lives on the target host. install.sh reads from here.
iac_agent_install_dir: /opt/IaCAgent

# Permissions on /etc/iac/secrets.yaml. Plaintext on disk per
# decisions.md "OpenBao backup / DR" rationale; mode 0600 root-owned.
iac_agent_secrets_mode: "0600"
