---
- name: Re-apply Calico cni.yaml
  # The IP_AUTODETECTION_METHOD patch lives in the snap-shipped cni.yaml
  # daemonset spec. Editing the file alone doesn't reach the running
  # cluster — Calico has to pick the change up via kubectl apply.
  #
  # `microk8s enable` (addons.yml) is async and can leave the apiserver
  # briefly unreachable when this handler fires at end of play. Retry
  # rather than gate on a separate readiness probe — kubectl apply
  # itself is the truthful signal that the apiserver is back.
  ansible.builtin.command: microk8s kubectl apply -f /var/snap/microk8s/current/args/cni-network/cni.yaml
  register: _microk8s_calico_apply
  until: _microk8s_calico_apply.rc == 0
  retries: 30
  delay: 2
  changed_when: true

- name: Report the microk8s restart a real run would perform (check mode)
  # The restart handlers shell out, so --check skips them, and ansible.cfg's
  # display_skipped_hosts = False hides even the skip. Each one covered has
  # a debug handler listening on its name that reports the would-be restart
  # as a change on every notified host instead. Only a changed task
  # notifies, so a converged host still shows changed=0 under --check.
  ansible.builtin.debug:
    msg: A real run would restart microk8s on this node (microk8s stop, then start).
  listen: Restart microk8s
  changed_when: true
  when: ansible_check_mode

- name: Restart microk8s
  # Containerd reads certs.d/<host>/hosts.toml at start; editing the
  # file doesn't reach the running daemon. `microk8s stop && start`
  # bounces containerd without disturbing the snap's cluster state.
  # Brief in-cluster outage on this node.
  ansible.builtin.command: "{{ item }}"
  loop:
    - microk8s stop
    - microk8s start
  changed_when: true

- name: Report the coredns rollout restart a real run would perform (check mode)
  ansible.builtin.debug:
    msg: A real run would rollout-restart kube-system/coredns.
  listen: Rollout-restart coredns
  changed_when: true
  when: ansible_check_mode

- name: Rollout-restart coredns
  # Same end-of-play apiserver-transient race as the Calico handler
  # above — retry the call rather than chasing a separate readiness
  # probe.
  ansible.builtin.command: microk8s kubectl rollout restart -n kube-system deployment/coredns
  register: _microk8s_coredns_rollout
  until: _microk8s_coredns_rollout.rc == 0
  retries: 30
  delay: 2
  changed_when: true

- name: Report the kubelite restart a real run would perform (check mode)
  ansible.builtin.debug:
    msg: A real run would restart kubelite on this node, one node at a time.
  listen: Restart microk8s kubelite
  changed_when: true
  when: ansible_check_mode

- name: Restart microk8s kubelite
  # kubelite is microk8s's combined apiserver/controller/scheduler/
  # proxy/kubelet process. Restarting just this unit picks up
  # kube-apiserver arg changes without bouncing containerd, so workload
  # pods on the node keep running — only the node's control plane and
  # kubelet blip for a few seconds. On prd the apiserver VIP and the
  # peer nodes cover that gap, provided only one node is ever in it.
  #
  # The one-node-at-a-time guarantee is carried here rather than left to
  # each caller's `serial:`: throttle 1 hands the restart to one host at
  # a time and the wait holds that host's slot until the node is ready
  # again. A node not ready within microk8s_kubelite_ready_timeout fails
  # the handler. Restart and wait must stay a single task — Ansible runs
  # a handler across every notified host before starting the next
  # handler, so split in two, every node would restart before any was
  # waited on.
  #
  # Ready depends on the node class:
  # - An apiserver node: its own apiserver passes /readyz on 16443, which
  #   covers the datastore and informer sync that /livez leaves out.
  # - A worker runs no apiserver, and its 16443 is the separate
  #   apiserver-proxy daemon, which answers while kubelite is still down.
  #   Its Node object, read through that proxy with the kubelet's own
  #   credential (the Node authorizer lets a kubelet read its own Node),
  #   has to show Ready=True with a heartbeat later than the second the
  #   restart returned. The Ready condition written before the restart
  #   stays True until the node controller marks the node lost. A
  #   restarted kubelet reports its status on its first sync, stamped by
  #   this node's clock, and `systemctl restart` returns only once the
  #   old kubelet has exited.
  ansible.builtin.shell:
    cmd: |
      set -eu
      systemctl restart snap.microk8s.daemon-kubelite
      restarted=$(date +%s)
      deadline=$(( restarted + {{ microk8s_kubelite_ready_timeout }} ))
      {% if microk8s_worker_only | bool %}
      awaited="Ready report from node {{ inventory_hostname }} after the restart"
      ready() {
        seen=$(/snap/microk8s/current/kubectl \
            --kubeconfig /var/snap/microk8s/current/credentials/kubelet.config \
            get node {{ inventory_hostname }} \
            -o 'jsonpath={range .status.conditions[?(@.type=="Ready")]}{.status} {.lastHeartbeatTime}{end}') \
          || return 1
        set -- $seen
        [ "${1:-}" = True ] && [ "$(date -d "${2:-}" +%s)" -gt "$restarted" ]
      }
      {% else %}
      awaited="HTTP 200 from https://127.0.0.1:16443/readyz"
      ready() {
        seen=$(curl -sk -m 5 -o /dev/null -w 'HTTP %{http_code}' https://127.0.0.1:16443/readyz) || :
        [ "$seen" = "HTTP 200" ]
      }
      {% endif %}
      seen=
      until ready; do
        if [ "$(date +%s)" -ge "$deadline" ]; then
          echo "kubelite restarted, but got no $awaited within {{ microk8s_kubelite_ready_timeout }}s (last seen: $seen)" >&2
          exit 1
        fi
        sleep 2
      done
  changed_when: true
  throttle: 1
