---
# microk8s release channel. Pinned per cluster in group_vars (k8s_prd.yml etc.).
# 1.35/stable is the homelab k8s base version per /work/AnsibleSpecs/decisions.md
# "k8s version policy" (dev runs a minor ahead). Clusters override in group_vars.
microk8s_channel: 1.35/stable

# Calico autodetection: which interface carries pod traffic. Defaults to
# whatever NIC Ansible finds on the default-route path — `eth0` on
# cloud-init'd VMs, `ens18` on the manually-installed live prod nodes,
# `eth0` on prod once those are rebuilt via cloud-init. Override
# per-cluster only if pod traffic should ride a non-default-route NIC
# (e.g. vmbr1 on prod once that backplane is verified — see
# decisions.md "Network topology"). Patched into
# /var/snap/microk8s/current/args/cni-network/cni.yaml.
microk8s_calico_iface: "{{ ansible_facts['default_ipv4'].interface }}"

# Cluster CIDRs. Empty defaults force every cluster to set them in
# group_vars — microk8s's compiled-in defaults (10.1.0.0/16) collide with
# the homelab LAN. The role asserts non-empty before installing.
microk8s_cluster_cidr_v4: ""
microk8s_service_cidr_v4: ""
microk8s_cluster_cidr_v6: ""
microk8s_service_cidr_v6: ""

# Extra SubjectAltNames added to the API server cert. Conventionally
# includes the service-CIDR gateway IP so clients addressing the API
# through the service network can verify TLS.
microk8s_extra_sans: []

# Addons enabled on every node the role runs against. Bare names only;
# microk8s install quirks that need positional args (today: metallb's
# IP-range prompt) are handled inline in tasks/addons.yml so inventory
# stays clean. Order matters in microk8s — `community` must precede
# community-namespaced addons.
microk8s_addons:
  - dns
  - helm
  - helm3
  - metrics-server

# OS users added to the `microk8s` group. Members can run kubectl/helm via
# the snap alias without sudo. Empty = no users added.
microk8s_users: []

# Worker-only node. When true, this node joins the cluster with
# `microk8s join --worker` and stays OUT of the dqlite/HA control-plane
# quorum: no apiserver, controller-manager, scheduler, or datastore. The
# role then (a) takes the worker join + idempotency path in join.yml,
# (b) skips the kube-apiserver concerns it can't host — the Keepalived
# VIP, the SNI TLS leaf, and the node-local Calico cni.yaml patch — and
# (c) excludes the node from primary election (a worker can never mint
# join tokens or reconcile cluster-scoped state). Default false: full
# control-plane member, the only shape the prd cluster knew before
# srvk8s4. See README "Worker-only nodes".
microk8s_worker_only: false

# Hostname of the cluster's primary node — the one from which addons,
# capability labels, the MetalLB pool spec, and the CoreDNS Corefile
# are reconciled, and the one the join token is requested from. Set
# to "" by default and OVERWRITTEN AT RUNTIME by the role's
# elect-primary.yml task list per the rules documented there. Don't
# pin it in inventory — the whole point of election is that a
# rebuilt labeled-primary stops being load-bearing.
microk8s_primary_host: ""

# MetalLB IPAddressPool + L2Advertisement reconciled by the role on the
# primary. Empty addresses list skips the task. The `metallb` addon
# must also be in microk8s_addons for the controller to be installed.
# Pool/advertisement names default to what the addon creates
# (`default-addresspool`, `default-advertise-all-pools`) so the role
# upserts in place — the sentinel range the addon was enabled with
# (see tasks/addons.yml) is overwritten the first time this runs.
microk8s_metallb_namespace: metallb-system
microk8s_metallb_pool_name: default-addresspool
microk8s_metallb_advertisement_name: default-advertise-all-pools
microk8s_metallb_pool_addresses: []

# Memory requests for the addon-owned workloads (tasks/addon-resources.yml).
# Values come from the same derivation HelmCharts' recommend-resources uses —
# p90 of the container's max working set over Prometheus history, rounded up
# to the next quarter-power-of-two. Re-derive them when a channel bump moves
# a component's footprint. An `addon:` key restricts an entry to clusters
# where that addon installed the workload; entries without one are the
# bundled CNI, present everywhere.
microk8s_addon_resource_requests:
  - kind: DaemonSet
    namespace: kube-system
    name: calico-node
    container: calico-node
    memory: 192Mi
  - kind: Deployment
    namespace: kube-system
    name: calico-kube-controllers
    container: calico-kube-controllers
    memory: 48Mi
  - kind: Deployment
    namespace: kube-system
    name: kubernetes-dashboard
    container: kubernetes-dashboard
    memory: 24Mi
    addon: dashboard
  - kind: Deployment
    namespace: kube-system
    name: dashboard-metrics-scraper
    container: dashboard-metrics-scraper
    memory: 20Mi
    addon: dashboard
  - kind: Deployment
    namespace: metallb-system
    name: controller
    container: controller
    memory: 56Mi
    addon: metallb
  - kind: DaemonSet
    namespace: metallb-system
    name: speaker
    container: speaker
    memory: 80Mi
    addon: metallb

# Kernel modules required by microk8s and the Ceph CSI clients. Loaded via
# /etc/modules-load.d/ so they survive reboots.
microk8s_kernel_modules:
  - nf_conntrack
  - ceph
  - rbd
  - nbd

# Packages required for the Ceph CSI client side. The k8s nodes mount
# RBD/CephFS volumes from the Ceph cluster but are not Ceph mons/osds
# themselves.
microk8s_ceph_client_packages:
  - ceph-common
  - rbd-nbd

# Containerd registry mirrors. Each entry is a `<host>:<port>` string
# matching the image-reference prefix; the role renders
# /var/snap/microk8s/current/args/certs.d/<entry>/hosts.toml pointing
# at `http://<entry>` with pull+resolve capabilities. Empty = no
# mirrors managed; operator-added entries (e.g. localhost:32000 from
# the microk8s registry addon) are left alone either way.
microk8s_registry_mirrors: []

# CoreDNS hosts overrides. Reconciled on the cluster primary into the
# kube-system/coredns ConfigMap. Each entry is `{ip, names}`. Empty =
# no hosts block in the rendered Corefile.
microk8s_coredns_hosts: []

# CoreDNS A-record templates. Each entry is `{domain, answer_a, ttl}`.
# Renders a `template IN A <domain>` block that answers any subdomain
# of <domain> with <answer_a>. Used to point public hostnames at an
# in-cluster ingress LB so in-cluster traffic doesn't loop out and back.
microk8s_coredns_templates: []

# Upstream DNS for the `.home` zone. When non-empty, the rendered
# Corefile gets a zone-scoped `forward home. <ips>` ahead of the
# default `forward . /etc/resolv.conf`, so `*.home` names resolve via
# the LAN DNS. The `hosts` block (fallthrough, listed earlier) still
# answers pinned names first, so this only catches the unpinned ones.
# Empty = no `.home` forward; `.home` follows /etc/resolv.conf.
microk8s_coredns_home_forwarders: []

# kube-apiserver VIP (Keepalived). false skips VIP setup entirely.
# Set true only on the 3-node prd cluster (group_vars/k8s_prd.yml) —
# the single-node dev cluster and the scratch fleet have no VIP. The
# VIP address and VRRP router-id come from group_vars/all/vips.yml,
# the shared VRRP secret from `vrrp_auth_password` there. See
# tasks/keepalived.yml and slices/internal-ha-vips.md.
microk8s_manage_apiserver_vip: false

# Enforce RBAC on the kube-apiserver instead of microk8s's default
# AlwaysAllow. false leaves the apiserver permissive (any authenticated
# identity is fully authorized). Set true per cluster in
# group_vars/k8s_*.yml. Applied per-node (tasks/rbac.yml), not via the
# primary-only addon list, because --authorization-mode is a per-node
# apiserver arg. See decisions.md "k8s clusters enforce RBAC".
microk8s_enable_rbac: false

# --- kubelet resource accounting (tasks/kubelet-args.yml) ---
# Off by default; set true per cluster in group_vars/k8s_*.yml. Enabling it
# shrinks allocatable by the reservation, so re-run the N-1 drain-feasibility
# check for the cluster before flipping it — the roll has to keep fitting the
# busiest node's pods onto the survivors.
microk8s_manage_kubelet_resources: false

# Sized from p99 of the cgroup-method overhead (root cgroup working set minus
# kubepods working set), which is what kubelet actually acts on — not from
# capacity - MemAvailable - sum(kubectl top), which double-counts reclaimable
# page cache. Measured 2026-08-02: 1.63-2.26 GiB p99 on the control-plane
# trio, 1.16 on the worker. Re-derive on a channel bump; the overhead tracks
# the software, not the node size.
microk8s_kube_reserved_memory: 2560Mi
microk8s_kube_reserved_memory_worker: 1536Mi

# Soft threshold on kubelet's memory.available signal. 1536Mi sits ~270 MiB
# above the 1.27 GiB floor srvk8s1 reached on 2026-08-02 while thrashing, so
# it bites on that shape of failure and not on ordinary spikes. Costs no
# allocatable — only hard thresholds do.
microk8s_eviction_soft_memory: 1536Mi
microk8s_eviction_soft_grace_period: 2m
microk8s_eviction_max_pod_grace_period: 60

# --- watch-cache freeze watchdog (k8s-dqlite#364 / microk8s#5386) ---
# A per-node systemd timer (tasks/watchdog.yml) probes this node's own
# apiserver watch cache and restarts k8s-dqlite on the freeze signature: the
# cache resourceVersion stays pinned across every sample while quorum reads
# advance and the gap exceeds _min_lag — the unambiguous freeze, not ordinary
# lag. Each apiserver node heals itself; no cross-node coordination. See
# docs/runbooks/dqlite-watch-freeze.md.
microk8s_watchfreeze_samples: 4
microk8s_watchfreeze_interval: 4
microk8s_watchfreeze_min_lag: 500
# Timer cadence: first probe OnBootSec after boot, then every _interval.
# _randomized_delay (seconds) jitters the nodes so they never probe — and
# never restart dqlite — in lockstep; it is the only stand-in for the
# cross-node coordination this design deliberately omits.
microk8s_watchdog_onboot: 2min
microk8s_watchdog_interval: 5min
microk8s_watchdog_randomized_delay: 120

# Homelab-CA TLS leaf for the kube-apiserver. The SANs the leaf carries;
# empty skips it. The leaf is served *additively* via the apiserver's
# --tls-sni-cert-key flag — a client whose SNI matches one of these
# names is handed the homelab leaf, every other connection (kubelet,
# controller-manager, in-cluster `kubernetes` Service traffic) still
# gets microk8s's own server.crt. Distinct from microk8s_extra_sans,
# which seeds microk8s's *own* cert at first boot; this leaf is separate
# and leaves the internal PKI untouched. Set per cluster in
# group_vars/k8s_*.yml. See tasks/internal_tls.yml and
# slices/internal-tls-step-ca.md §F.
microk8s_apiserver_homelab_sans: []
