---
- name: Apply netplan
  ansible.builtin.command: netplan apply
  changed_when: true
  when: baseline_netplan_apply | bool

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
