---
# One entry of step_ca_secrets: Secret step_ca_secret.name holding
# _step_ca_secret_data. Every task that touches its data is no_log:
# ansible.cfg makes every run a --diff run, and the module's diff and
# result carry the data. no_log also hides a loop item's label, so each
# task name carries the Secret's name instead.

- name: Read Secret {{ step_ca_secret.name }}
  kubernetes.core.k8s_info:
    kubeconfig: "{{ step_ca_kubeconfig }}"
    validate_certs: false
    kind: Secret
    namespace: "{{ step_ca_namespace }}"
    name: "{{ step_ca_secret.name }}"
  register: _step_ca_secret_live
  no_log: true

# force replaces the whole object, so the definition is all of it: Argo's
# argocd.argoproj.io/tracking-id goes, which keeps Argo from pruning the
# Secret, and so does kubectl's last-applied-configuration, a copy of the
# data.
- name: Secret {{ step_ca_secret.name }}
  kubernetes.core.k8s:
    kubeconfig: "{{ step_ca_kubeconfig }}"
    validate_certs: false
    force: true
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ step_ca_secret.name }}"
        namespace: "{{ step_ca_namespace }}"
      data: "{{ _step_ca_secret_data }}"
  no_log: true

# Data only: a metadata change, such as the dropped tracking-id, leaves
# what step-ca reads as it was. A missing Secret counts as changed.
- name: Compare with the data step-ca had in Secret {{ step_ca_secret.name }}
  ansible.builtin.set_fact:
    _step_ca_material_changed: >-
      {{ _step_ca_material_changed
         or (_step_ca_secret_live.resources | map(attribute='data') | first | default({})) != _step_ca_secret_data }}
  no_log: true
