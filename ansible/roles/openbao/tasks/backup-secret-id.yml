---
# The scoped delivery of a backup AppRole secret_id, run through
# playbooks/openbao-backup-secret-id.yml. The caller (the SecretRotator)
# mints the secret_id; these tasks prove it with a login and write it
# where the backup wrapper reads it. They mint nothing and configure
# nothing else: backup.yml owns the pipeline, so a node it has not
# configured is refused.

- name: Require the backup secret_id to deliver
  ansible.builtin.assert:
    that: openbao_backup_secret_id | length > 0
    fail_msg: >-
      No secret_id to deliver: set openbao_backup_secret_id in an
      extra-vars file (--extra-vars @<file>), never on the command line.
    quiet: true

- name: Stat the node's backup AppRole role_id
  ansible.builtin.stat:
    path: "{{ openbao_config_dir }}/backup-role-id"
  register: _openbao_delivery_role_id_file

- name: Refuse a node whose backup pipeline is not configured
  ansible.builtin.fail:
    msg: >-
      {{ openbao_config_dir }}/backup-role-id is missing on
      {{ inventory_hostname }}: its backup pipeline is not configured.
      Converge site-openbao.yml first.
  when: not _openbao_delivery_role_id_file.stat.exists

- name: Read the node's backup AppRole role_id
  ansible.builtin.slurp:
    src: "{{ openbao_config_dir }}/backup-role-id"
  register: _openbao_delivery_role_id
  no_log: true

# The login proves the pair the backup wrapper logs in with. It runs
# under --check too. no_log hides the uri module's failure message, so
# the fail task below reports the status and OpenBao's error text.
- name: Log in with the node's role_id and the secret_id to deliver
  ansible.builtin.uri:
    url: "{{ openbao_admin_api_addr }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body:
      role_id: "{{ _openbao_delivery_role_id.content | b64decode | trim }}"
      secret_id: "{{ openbao_backup_secret_id }}"
    validate_certs: true
  register: _openbao_delivery_login
  failed_when: false
  no_log: true
  check_mode: false

- name: Fail when the login with the secret_id to deliver did not succeed
  ansible.builtin.fail:
    msg: >-
      The backup AppRole login at {{ openbao_admin_api_addr }} with the
      secret_id to deliver returned HTTP {{ _openbao_delivery_login.status }}:
      {{ _openbao_delivery_login.json.errors | default([_openbao_delivery_login.msg | default('')]) | join('; ') }}.
      The secret_id was not written.
  when: _openbao_delivery_login.status != 200

- name: Revoke the token the proving login returned
  ansible.builtin.uri:
    url: "{{ openbao_admin_api_addr }}/v1/auth/token/revoke-self"
    method: POST
    headers:
      X-Vault-Token: "{{ _openbao_delivery_login.json.auth.client_token }}"
    status_code: 204
    validate_certs: true
  register: _openbao_delivery_revoke
  failed_when: false
  no_log: true
  check_mode: false

- name: Fail when the proving login's token was not revoked
  ansible.builtin.fail:
    msg: >-
      Revoking the backup AppRole token the proving login returned
      failed: auth/token/revoke-self returned HTTP
      {{ _openbao_delivery_revoke.status }}:
      {{ _openbao_delivery_revoke.json.errors | default([_openbao_delivery_revoke.msg | default('')]) | join('; ') }}.
      The secret_id was not written.
  when: _openbao_delivery_revoke.status != 204

- name: Write the backup AppRole secret_id
  ansible.builtin.copy:
    dest: "{{ openbao_config_dir }}/backup-secret-id"
    content: "{{ openbao_backup_secret_id }}"
    owner: openbao
    group: openbao
    mode: "0400"
  no_log: true
