---
# OIDC provisioning — Keycloak-backed web UI / CLI login. Runs only on
# the bootstrap host; OIDC config, role, and the underlying auth mount
# live in the Raft store and replicate to followers. The client secret
# is the SecretRotator's leaf, openbao_oidc_client_secret_leaf: until
# it holds a client_secret the file leaves OIDC untouched, so it never
# writes an empty secret.

- name: Acquire the controller's OpenBao token
  ansible.builtin.import_tasks: auth-token.yml

# Read-only, so it runs in check mode too: without the secret the
# block below skips and `--check` would report no OIDC drift.
- name: Read the OIDC client secret from the rotator's leaf
  ansible.builtin.uri:
    url: "{{ openbao_admin_api_addr }}/v1/{{ openbao_kv_mount }}/data/{{ openbao_oidc_client_secret_leaf }}"
    method: GET
    headers:
      X-Vault-Token: "{{ _openbao_token }}"
    status_code: [200, 404]
    validate_certs: true
  register: _openbao_oidc_client_secret_read
  no_log: true
  check_mode: false
  when: _openbao_token | length > 0

- name: Take the OIDC client secret from the leaf
  ansible.builtin.set_fact:
    _openbao_oidc_client_secret: "{{ _openbao_oidc_client_secret_read.json.data.data.client_secret | default('') }}"
  no_log: true

- name: Skip OIDC provisioning while the rotator's leaf holds no client secret
  ansible.builtin.debug:
    msg: >-
      {{ openbao_kv_mount }}/{{ openbao_oidc_client_secret_leaf }} holds
      no client_secret (HTTP {{ _openbao_oidc_client_secret_read.status }}).
      Store the Keycloak {{ openbao_oidc_client_id }} client's secret
      there. OIDC provisioning skipped; the OIDC config is left untouched.
  when:
    - _openbao_token | length > 0
    - _openbao_oidc_client_secret | length == 0

- name: Provision OIDC auth method, config, and admin role
  when:
    - _openbao_token | length > 0
    - _openbao_oidc_client_secret | length > 0
  vars:
    _bao_headers:
      X-Vault-Token: "{{ _openbao_token }}"
  block:

    - name: Assert OIDC inputs
      ansible.builtin.assert:
        that:
          - openbao_oidc_discovery_url | length > 0
          - openbao_oidc_client_id | length > 0
          - openbao_oidc_default_role | length > 0
          - openbao_oidc_admin_user_claim | length > 0
          - openbao_oidc_admin_groups_claim | length > 0
          - openbao_oidc_admin_bound_group | length > 0
          - openbao_oidc_admin_policies | length > 0
          - openbao_oidc_admin_redirect_uris | length > 0
        fail_msg: >-
          OIDC inputs missing. Required when the client secret is set:
          openbao_oidc_discovery_url, openbao_oidc_client_id,
          openbao_oidc_default_role, openbao_oidc_admin_user_claim,
          openbao_oidc_admin_groups_claim,
          openbao_oidc_admin_bound_group,
          openbao_oidc_admin_policies,
          openbao_oidc_admin_redirect_uris.

    # ----- oidc auth method -------------------------------------------

    - name: Read enabled auth methods
      ansible.builtin.uri:
        url: "{{ openbao_admin_api_addr }}/v1/sys/auth"
        method: GET
        headers: "{{ _bao_headers }}"
        status_code: 200
        validate_certs: true
      register: _openbao_auth_methods_oidc
      no_log: true
      check_mode: false

    - name: Enable the oidc auth method
      ansible.builtin.uri:
        url: "{{ openbao_admin_api_addr }}/v1/sys/auth/oidc"
        method: POST
        headers: "{{ _bao_headers }}"
        body_format: json
        body:
          type: oidc
        status_code: 204
        validate_certs: true
      # Runs only when the state differs (`when` below), so the write is a change.
      changed_when: true
      when: "'oidc/' not in _openbao_auth_methods_oidc.json"

    # ----- oidc config ------------------------------------------------
    #
    # POST replaces the whole config. The readback redacts
    # oidc_client_secret, so a strict drift comparison would never
    # match — we always write instead. Server-side write is cheap and
    # the leaf's secret stays in sync without an explicit
    # rotation flag. Changed reports only a difference in the readable
    # fields: a rotation of the client secret alone is written but
    # reports ok.

    - name: Read the OIDC config
      ansible.builtin.uri:
        url: "{{ openbao_admin_api_addr }}/v1/auth/oidc/config"
        method: GET
        headers: "{{ _bao_headers }}"
        status_code: [200, 404]
        validate_certs: true
      register: _openbao_oidc_config
      no_log: true
      check_mode: false

    - name: Compare the OIDC config's readable fields
      ansible.builtin.set_fact:
        _openbao_oidc_config_differs: >-
          {{
            _openbao_oidc_config.status != 200
            or (_openbao_oidc_config.json.data.oidc_discovery_url | default(none))
               != openbao_oidc_discovery_url
            or (_openbao_oidc_config.json.data.oidc_client_id | default(none))
               != openbao_oidc_client_id
            or (_openbao_oidc_config.json.data.default_role | default(none))
               != openbao_oidc_default_role
          }}

    - name: Write the OIDC config (Keycloak realm)
      ansible.builtin.uri:
        url: "{{ openbao_admin_api_addr }}/v1/auth/oidc/config"
        method: POST
        headers: "{{ _bao_headers }}"
        body_format: json
        body:
          oidc_discovery_url: "{{ openbao_oidc_discovery_url }}"
          oidc_client_id: "{{ openbao_oidc_client_id }}"
          oidc_client_secret: "{{ _openbao_oidc_client_secret }}"
          default_role: "{{ openbao_oidc_default_role }}"
        status_code: [200, 204]
        validate_certs: true
      changed_when: _openbao_oidc_config_differs | bool
      no_log: true

    # --check skips the write (uri has no check mode); report it instead so
    # the drift check sees OIDC config drift.
    - name: Report the OIDC config write a real run would change (check mode)
      ansible.builtin.debug:
        msg: A real run would change the OIDC config's discovery URL, client id or default role.
      changed_when: true
      when:
        - ansible_check_mode
        - _openbao_oidc_config_differs | bool

    # ----- oidc admin role --------------------------------------------
    #
    # 1:1 mapping: members of the Keycloak group named in
    # openbao_oidc_admin_bound_group log in to the OIDC role named in
    # openbao_oidc_default_role and receive the policies listed in
    # openbao_oidc_admin_policies. Defaults wire all three to
    # "openbao-admin" so a Keycloak admin's `groups` claim maps
    # straight to the OpenBao admin policy. bound_audiences pins the
    # ID token's `aud` to this client; Keycloak's default ID token
    # already carries aud=<client_id>, no extra audience mapper needed.

    - name: Build the OIDC role's bound_claims dict
      ansible.builtin.set_fact:
        _openbao_oidc_admin_bound_claims: >-
          {{
            {} | combine({
              openbao_oidc_admin_groups_claim: [openbao_oidc_admin_bound_group]
            })
          }}

    - name: Read the OIDC admin role
      ansible.builtin.uri:
        url: "{{ openbao_admin_api_addr }}/v1/auth/oidc/role/{{ openbao_oidc_default_role }}"
        method: GET
        headers: "{{ _bao_headers }}"
        status_code: [200, 404]
        validate_certs: true
      register: _openbao_oidc_admin_role
      check_mode: false

    # Compare only what the write sends, TTLs normalised to the whole
    # seconds OpenBao reads back. A TTL the filter cannot read normalises
    # to none and counts as a difference: a misread can cost a needless
    # write but never skip a needed one.
    - name: Compare the OIDC admin role
      vars:
        _role: "{{ _openbao_oidc_admin_role.json.data | default({}) }}"
      ansible.builtin.set_fact:
        _openbao_oidc_admin_role_differs: >-
          {{
            _openbao_oidc_admin_role.status != 200
            or (_role.role_type | default(none)) != 'oidc'
            or (_role.user_claim | default(none)) != openbao_oidc_admin_user_claim
            or (_role.groups_claim | default(none)) != openbao_oidc_admin_groups_claim
            or (_role.bound_audiences | default(none)) != [openbao_oidc_client_id]
            or (_role.bound_claims | default(none)) != _openbao_oidc_admin_bound_claims
            or (_role.token_policies | default(none)) != openbao_oidc_admin_policies
            or (_role.token_ttl | default(none))
               != (openbao_oidc_admin_token_ttl | openbao_duration_seconds)
            or (_role.token_max_ttl | default(none))
               != (openbao_oidc_admin_token_max_ttl | openbao_duration_seconds)
            or not (_role.token_no_default_policy | default(false))
            or (_role.allowed_redirect_uris | default(none)) != openbao_oidc_admin_redirect_uris
          }}

    - name: Write the OIDC admin role (only when it differs)
      ansible.builtin.uri:
        url: "{{ openbao_admin_api_addr }}/v1/auth/oidc/role/{{ openbao_oidc_default_role }}"
        method: POST
        headers: "{{ _bao_headers }}"
        body_format: json
        body:
          role_type: oidc
          user_claim: "{{ openbao_oidc_admin_user_claim }}"
          groups_claim: "{{ openbao_oidc_admin_groups_claim }}"
          bound_audiences:
            - "{{ openbao_oidc_client_id }}"
          bound_claims: "{{ _openbao_oidc_admin_bound_claims }}"
          token_policies: "{{ openbao_oidc_admin_policies }}"
          token_ttl: "{{ openbao_oidc_admin_token_ttl }}"
          token_max_ttl: "{{ openbao_oidc_admin_token_max_ttl }}"
          token_no_default_policy: true
          allowed_redirect_uris: "{{ openbao_oidc_admin_redirect_uris }}"
        status_code: [200, 204]
        validate_certs: true
      # Runs only when the state differs (`when` below), so the write is a change.
      changed_when: true
      when: _openbao_oidc_admin_role_differs | bool

    # --check skips the write (uri has no check mode); report it instead so
    # the drift check sees OIDC role drift.
    - name: Report the OIDC admin role write a real run would perform (check mode)
      ansible.builtin.debug:
        msg: A real run would rewrite OIDC role {{ openbao_oidc_default_role }}.
      changed_when: true
      when:
        - ansible_check_mode
        - _openbao_oidc_admin_role_differs | bool
