---
- name: Reload systemd
  # Picks up drop-ins under /etc/systemd/system/openbao.service.d/.
  # Notified before Restart openbao so the daemon-reload runs first.
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart openbao
  ansible.builtin.systemd:
    name: openbao
    state: restarted

- name: Reload openbao
  # Listener TLS cert reissue: SIGHUP reloads the listener cert without
  # dropping the Raft connection (openbao reloads on SIGHUP per docs).
  # throttle 1 hands the SIGHUP to one Raft peer at a time whatever
  # drove the play, so the three peers never reload at once — the
  # property site-openbao.yml's serial gives the converge path, carried
  # by the reload itself rather than restated on each caller.
  ansible.builtin.systemd:
    name: openbao
    state: reloaded
  throttle: 1
