---
# `community.general.snap` parses `snap info microceph` for a `name:`
# line that is missing until snapd's first-boot seed completes, raising
# IndexError on a freshly-booted VM. Bound the warm-up; idempotent once
# seeded. (Same guard as the microk8s role.)
- name: Wait for snapd to finish seeding
  ansible.builtin.command: snap wait system seed.loaded
  changed_when: false

# microceph is strictly confined — no `classic: true`, unlike microk8s.
- name: Install microceph snap (channel = {{ microceph_channel }})
  community.general.snap:
    name: microceph
    channel: "{{ microceph_channel }}"
    state: present

# The daemon binds the host address the moment it starts. On a boot where
# DHCP lags (2026-09-25), it failed "cannot assign requested address" five
# times inside systemd's start limit and stayed down for days. mon, osd and
# rgw kept running, so only the microceph CLI noticed. Retry until the
# address is up.
- name: Ensure the snap.microceph.daemon drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/snap.microceph.daemon.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Keep restarting the microceph daemon until it binds
  ansible.builtin.copy:
    dest: /etc/systemd/system/snap.microceph.daemon.service.d/restart.conf
    content: |
      [Unit]
      StartLimitIntervalSec=0

      [Service]
      RestartSec=10
    owner: root
    group: root
    mode: "0644"
