---
# The daemon runs before bootstrap too, so it should always be up.
# daemon_reload picks up the restart drop-in from install.yml.
- name: Ensure the microceph daemon is running
  ansible.builtin.systemd:
    name: snap.microceph.daemon
    state: started
    daemon_reload: true

# microcluster's own "bootstrapped or joined?" test (isInitialized in
# internal/db/dqlite.go). Don't probe with `microceph status`: it also
# fails while the daemon is down or still opening its database, and
# reading that as "not bootstrapped" ran bootstrap against the live
# cluster twice (2026-09-28, 2026-09-29).
- name: Probe whether the node is bootstrapped
  ansible.builtin.stat:
    path: /var/snap/microceph/common/state/database/info.yaml
  register: _microceph_db

- name: Bootstrap the single-node cluster
  ansible.builtin.command: microceph cluster bootstrap
  when: not _microceph_db.stat.exists
  register: _microceph_bootstrap
  changed_when: _microceph_bootstrap.rc == 0

# Bootstrap returns before the mon/mgr are fully serving, and a freshly
# started daemon takes a moment to open its database; block until status
# reports cleanly so the OSD-add and config steps don't race either.
# Check mode can't wait on a bootstrap it skipped.
- name: Wait for the cluster to report status
  ansible.builtin.command: microceph status
  register: _microceph_status_post
  until: _microceph_status_post.rc == 0
  retries: 30
  delay: 2
  changed_when: false
  check_mode: false
  when: _microceph_db.stat.exists or not ansible_check_mode
