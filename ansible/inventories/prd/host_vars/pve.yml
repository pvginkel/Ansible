---
# PVE storage that holds vzdump backups for VMs on this node. Read by the
# per-VM Terraform modules to decide each managed disk's `backup=` flag:
# disks on a VM whose `pve_node` declares this attribute get backup=true,
# everything else (VMs on pve1/pve2, plus all passthrough disks) is
# backup=false. See /work/AnsibleSpecs/decisions.md "Backup".
pve_node_backup_datastore: local-backup

# /dev/sda, the Samsung 870 EVO 2 TB that was the uncommitted spare, backs
# the `local-lvm-ssd` LVM-thin storage since 2026-11-15 (created by hand
# with `pvesh create /nodes/pve/disks/lvmthin`; no role manages PVE
# storages). It carries the guests that don't need the NVMe: srvk8sdev
# (terraform/prd/vms.tf), srvhomeassistant, wrkdev and wrkmariska. Their
# EFI, TPM and cloud-init volumes stay on `local-lvm`.
