---
# openbao-backup-secret-id.yml — deliver a backup AppRole secret_id to
# every srvvaultN and do nothing else: the SecretRotator's `playbook`
# delivery for the backup AppRole (AnsibleSpecs
# secret-rotation/design.md §6). The caller mints the secret_id; the
# play proves it with a login and writes it where the backup wrapper
# reads it. Converging the vault nodes stays site-openbao.yml's.
#
# Run, with the secret_id in a 0600 file holding
# `openbao_backup_secret_id: <secret_id>`:
#   ansible-playbook playbooks/openbao-backup-secret-id.yml \
#     --tags openbao_backup_secret_id --extra-vars @<file>

- name: Deliver a backup AppRole secret_id to the srvvault nodes
  hosts: openbao
  become: true
  gather_facts: false
  # Every node logs in with the secret_id before any node writes it, so
  # a failure on one node before the write leaves all three as they were.
  any_errors_fatal: true
  tasks:
    - name: Prove and write the backup AppRole secret_id
      ansible.builtin.import_role:
        name: openbao
        tasks_from: backup-secret-id
      tags:
        - openbao_backup_secret_id
