---
# reissue-host-cert.yml — re-issue a managed host's SSH host certificate
# over the pre-certificate bootstrap channel.
#
# Recovery for the deadlock where a host's step-ca host certificate is
# unusable but its host key is otherwise intact: the committed
# `@cert-authority` line cannot vouch for the host, it goes UNREACHABLE
# — and the very role that would re-sign the cert (ssh_host_cert) can no
# longer connect to run. Two ways in:
#
#   - **Missing cert.** cloud-init, on a new instance-id, deletes and
#     regenerates the host keys (taking `*-cert.pub` with them). The
#     Terraform-pinned key is rewritten to the same value, so the bare
#     key still matches `terraform output host_pubkeys` — exactly what
#     Play 1 pins below — only the certificate is gone.
#
#   - **Expired cert.** Nothing re-signed it inside the 14-day renewal
#     window, so sshd still serves a certificate and ssh still rejects
#     it ("Certificate invalid: expired"). Both key and cert are on
#     disk; only the validity window lapsed.
#
# The expired case is why Play 2 offers *only* `ssh-ed25519` below —
# see the comment there.
#
# Run per host, or against several at once (comma-separated):
#   ansible-playbook playbooks/reissue-host-cert.yml -e reissue_target=<hostname>
#   ansible-playbook playbooks/reissue-host-cert.yml -e reissue_target=srvk8s1,srvk8s2
#
# This converges only ssh_host_cert. It assumes the host is otherwise a
# fully-converged managed host (baseline's homelab CA root in the trust
# store, and on k8s nodes the `ca.home` /etc/hosts pin) — which holds
# for a host that lost its cert post-converge. For a brand-new VM use
# rebuild-k8s.yml (full bootstrap), not this.

# Seed a transient known_hosts from `terraform output` — the host key
# Terraform generated and embedded via cloud-init, authoritative and no
# TOFU — for the single pre-certificate connection. Mirrors Play 1 of
# rebuild-k8s.yml. See AnsibleSpecs slices/ssh-host-ca.md.
- name: Seed a transient known_hosts for the cert-less hosts
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    _tf_workspace: "{{ playbook_dir }}/../../terraform/prd"
    _transient_known_hosts: "{{ playbook_dir }}/../../tmp/reissue-known-hosts"
    _reissue_targets: "{{ reissue_target | mandatory | split(',') | map('trim') | select | list }}"
  tasks:
    # `terraform output` opens the working directory and validates
    # against .terraform/providers, so a fresh checkout / container
    # without a prior init fails the same way `terraform plan` does.
    # init is idempotent and fast when .terraform/ is already warm.
    - name: Ensure the terraform working directory is initialised
      ansible.builtin.command:
        argv:
          - terraform
          - "-chdir={{ _tf_workspace }}"
          - init
          - -input=false
          - -no-color
      changed_when: false
      check_mode: false

    - name: Read from-scratch host public keys from terraform output
      ansible.builtin.command:
        argv:
          - terraform
          - "-chdir={{ _tf_workspace }}"
          - output
          - -json
          - host_pubkeys
      register: _tf_host_pubkeys
      changed_when: false
      check_mode: false

    - name: Require a host key for every reissue target
      ansible.builtin.assert:
        that: item in (_tf_host_pubkeys.stdout | from_json)
        fail_msg: >-
          terraform output host_pubkeys has no entry for
          {{ item }} — this playbook only recovers from-scratch
          VMs whose host key Terraform pins.
      loop: "{{ _reissue_targets }}"

    - name: Ensure the transient known_hosts directory exists
      ansible.builtin.file:
        path: "{{ _transient_known_hosts | dirname }}"
        state: directory
        mode: "0755"
      check_mode: false

    - name: Write the cert-less hosts' pinned keys to the transient known_hosts
      ansible.builtin.copy:
        dest: "{{ _transient_known_hosts }}"
        content: |
          {% for host in _reissue_targets %}
          {{ host }},{{ host }}.home {{ (_tf_host_pubkeys.stdout | from_json)[host] }}
          {% endfor %}
        mode: "0644"
      check_mode: false

- name: Re-issue the SSH host certificate on the target
  hosts: "{{ reissue_target | mandatory }}"
  become: true
  gather_facts: true
  vars:
    # Replace ssh_args wholesale — for repeated `-o` options OpenSSH
    # takes the first value, so an appended common_args cannot override
    # ansible.cfg's UserKnownHostsFile. The transient file (Play 1)
    # carries the Terraform-pinned bare key. The rest mirrors
    # ansible.cfg's ssh_args.
    #
    # HostKeyAlgorithms is `ssh-ed25519` ALONE, deliberately — not
    # ansible.cfg's cert-then-bare list. sshd serves the *first*
    # algorithm the client offers that it can satisfy, and a host whose
    # certificate merely expired still has one to serve. Offering the
    # cert type first therefore hands us back the very cert we came to
    # replace, ssh rejects it as expired, and there is no fallback — the
    # client does not retry with the bare key. Offering only
    # `ssh-ed25519` forces sshd onto the bare key the transient pin
    # covers, which works for both entry points in the header: an absent
    # cert and an expired one.
    ansible_ssh_args: >-
      -o ControlMaster=auto -o ControlPersist=60s
      -o PreferredAuthentications=publickey
      -o "UserKnownHostsFile={{ playbook_dir }}/../../tmp/reissue-known-hosts"
      -o GlobalKnownHostsFile=/dev/null
      -o HostKeyAlgorithms=ssh-ed25519
      -o IdentityFile=~/.ssh/id_ed25519_ansible -o IdentitiesOnly=yes
  roles:
    - role: ssh_host_cert
