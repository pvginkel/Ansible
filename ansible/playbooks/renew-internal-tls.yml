---
# renew-internal-tls.yml — keep every internal_tls step-ca leaf
# certificate inside its validity window.
#
# The X.509 counterpart to renew-host-certs.yml, and its own artifact
# for the same reason: until it existed nothing renewed these leaves on
# a schedule.
#
#   - iac-scheduled-drift runs `ansible-playbook --check`. Issuance is a
#     `command`, so check mode skips it — drift reports a due renewal as
#     changed and is structurally incapable of signing one. It checks at
#     7 days rather than 14, so what it reports is a renewal this job
#     has missed, not one it has yet to make.
#   - Otherwise the leaves are converged only by site.yml, site-k8s.yml
#     and site-openbao.yml under iac-apply, which runs when someone
#     starts it by hand.
#
# Leaves live 47 days and internal_tls re-issues inside the last 14, so
# something must reach every leaf at least every 33 days. Weekly gives
# two attempts inside the window before any leaf lapses — the same
# arithmetic renew-host-certs.yml was sized against. Outside the window
# the role issues nothing, so a run against a healthy fleet reports
# changed=0 and this playbook is safe to run at any time.
#
# Ten leaves on ten hosts: pveproxy on pve/pve1/pve2, the kube-apiserver
# homelab SNI leaf on the k8s control planes, the OpenBao listener leaf
# on srvvault1/2/3. srvk8s4 is in `k8s` and drops out on its own — it is
# microk8s_worker_only, and the eligibility gate inside
# roles/microk8s/tasks/internal_tls.yml is what skips it. Nothing here
# restates that gate.
#
# Each leaf is reached by entering its consumer role at that role's own
# internal_tls task file, where the leaf's SANs, install paths,
# ownership and reload handler are declared once. Entering the *role* —
# rather than including internal_tls directly — is what carries the
# role's defaults, vars and handlers along with the tasks, so this path
# and the converge path cannot disagree about what a leaf is.
#
# srvvault1/2/3 are reached over the plain ansible.cfg args, not
# site-openbao.yml's `terraform output` known_hosts handoff: they carry
# signed SSH host certificates now, so this job needs no Terraform
# working directory and no Proxmox credentials.
#
# Run:
#   ansible-playbook playbooks/renew-internal-tls.yml
#   ansible-playbook playbooks/renew-internal-tls.yml --limit '!k8s_dev'
#   ansible-playbook playbooks/renew-internal-tls.yml --limit k8s_dev

- name: Renew internal_tls leaf certificates approaching expiry
  # One play across all three consumer groups rather than one play per
  # group: when every host of a play fails, Ansible abandons the run and
  # the later plays never execute (max_fail_percentage does not lift
  # that), so one wedged group would cost the other groups their
  # renewal. Within a single play a failing host only drops itself.
  hosts: proxmox:k8s:openbao
  become: true
  gather_facts: true
  # A leaf is installed by one task and picked up by a handler at end of
  # play. Without this, a host that fails anywhere after issuance drops
  # its pending reload — and the next run, finding a fresh leaf on disk,
  # issues nothing and notifies nothing, leaving the service on the
  # certificate it loaded before.
  force_handlers: true
  # No any_errors_fatal and no serial: renewal is per-host and
  # independent, so one unreachable or wedged host must not stop the
  # others from being renewed. A host that fails here still fails the
  # run, so the pipeline still pages. `serial:` would invert that —
  # Ansible ends the play once an entire batch has failed, and under
  # `serial: 1` a batch is one host, so the first failed or unreachable
  # host leaves every later host untried. `max_fail_percentage` does not
  # buy it back; that check only ever breaks the play earlier. The
  # one-at-a-time guarantee the kubelite restart and the OpenBao reload
  # need is carried by those handlers' own `throttle: 1`, not by the
  # driver.
  tasks:
    # Group membership is the only routing done here. Every other
    # condition on whether a host has a leaf lives in the task files
    # below, next to the leaf's declaration.
    - name: Renew the pveproxy TLS leaf
      ansible.builtin.import_role:
        name: proxmox_host
        tasks_from: internal_tls
      when: "'proxmox' in group_names"

    - name: Renew the kube-apiserver homelab TLS leaf
      ansible.builtin.import_role:
        name: microk8s
        tasks_from: internal_tls
      when: "'k8s' in group_names"

    - name: Renew the OpenBao listener TLS leaf
      ansible.builtin.import_role:
        name: openbao
        tasks_from: internal_tls
      when: "'openbao' in group_names"
