---
# rebalance-k8s.yml — two descheduler passes on the prd cluster, the last
# stage of the weekly OS-update roll (Jenkinsfile.iac-scheduled-update).
#
# Nothing reschedules a running pod: after update-k8s.yml's drains, each
# pod stays wherever it landed. Overflow sits on srvk8s1, whose
# PreferNoSchedule taint keeps its headroom for Jenkins agents, and the
# node drained last is left near-empty while its peers run full. The
# descheduler evicts what a fresh scheduling decision would place
# elsewhere. Argo CD deploys it from PlatformAddOnsDeploy's descheduler/
# as the suspended CronJob descheduler-prd, and the policies are in that
# directory's README.
#
# The taint pass moves every pod off srvk8s1 that does not tolerate its
# taint; the balance pass then moves pods off srvk8s2 or srvk8s3 when one
# is nearly full. Each is a Job created from the CronJob with its
# policy-volume pointed at the pass's ConfigMap, started once the pass
# before it has finished; this play waits for each and prints its log.
#
# prd only: the descheduler is deployed on prd alone, and srvk8sdev is a
# single node. Run it by hand after anything else that leaves the cluster
# unbalanced, such as a rebuild or a manual drain:
#
#   poetry run ansible-playbook playbooks/rebalance-k8s.yml --limit k8s_prd

- name: Rebalance the cluster's pods with the descheduler's two passes
  hosts: k8s_prd
  become: true
  gather_facts: false
  vars:
    rebalance_k8s_namespace: descheduler-prd
    rebalance_k8s_cronjob: descheduler-prd
    # In this order: the balance pass weighs srvk8s2 and srvk8s3 with the
    # pods the taint pass moved off srvk8s1 already on them.
    rebalance_k8s_passes:
      - name: taints
        policy: descheduler-prd
      - name: balance
        policy: descheduler-balance
  tasks:
    - name: Elect this cluster's primary
      ansible.builtin.import_role:
        name: microk8s
        tasks_from: elect-primary

    - name: Skip non-primary peers
      ansible.builtin.meta: end_host
      when: inventory_hostname != microk8s_primary_host

    - name: Name this run's Jobs
      ansible.builtin.set_fact:
        _rebalance_k8s_run: "rebalance-{{ now(utc=true).strftime('%Y%m%d%H%M%S') }}"

    - name: Run the descheduler passes
      ansible.builtin.include_tasks: tasks/descheduler-pass.yml
      loop: "{{ rebalance_k8s_passes }}"
      loop_control:
        loop_var: rebalance_k8s_pass
        label: "{{ rebalance_k8s_pass.name }}"
