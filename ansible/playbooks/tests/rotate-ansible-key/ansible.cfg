# Read through ANSIBLE_CONFIG by run.sh, in place of ansible/ansible.cfg:
# no inventory, so the prd hosts stay out. Diffs stay on, as there, so a
# private half in a diff shows in the runs' output. Paths are relative to
# this directory.
[defaults]
collections_path = ../../../collections
stdout_callback = default
retry_files_enabled = False
interpreter_python = auto_silent

[diff]
always = True
