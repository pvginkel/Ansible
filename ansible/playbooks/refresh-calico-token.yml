---
# refresh-calico-token.yml — rolling-restart the calico-node DaemonSet to
# keep every pod's uptime under Calico's token-refresh stall window.
#
# The Calico CNI plugin authenticates to the apiserver with a bounded
# ServiceAccount token that calico-node's token_watch.go rewrites into
# /var/snap/microk8s/current/args/cni-network/calico-kubeconfig on an
# interval. On long-uptime pods that watcher silently stops
# (projectcalico/calico#8777, worker nodes especially); the on-disk token
# then expires and every new pod sandbox on that node fails with "error
# getting ClusterInformation: connection is unauthorized: Unauthorized".
# Restarting calico-node re-runs the installer and writes a fresh token,
# so a weekly roll caps uptime below the expiry window.
#
# Re-evaluate after every microk8s channel bump — retire this once the
# bundled Calico carries the fix. See docs/runbooks/k8s-upgrade.md.
#
# Cluster-scoped: only the elected primary issues the rollout; the roll
# itself cycles calico-node on every node, one at a time.

- name: Rolling-restart calico-node to refresh its CNI token
  hosts: k8s
  become: true
  gather_facts: false
  tasks:
    - name: Elect this cluster's primary
      ansible.builtin.import_role:
        name: microk8s
        tasks_from: elect-primary

    - name: Skip non-primary peers
      ansible.builtin.meta: end_host
      when: inventory_hostname != microk8s_primary_host

    - name: Roll the calico-node DaemonSet
      ansible.builtin.command:
        argv:
          - microk8s
          - kubectl
          - --namespace
          - kube-system
          - rollout
          - restart
          - daemonset/calico-node
      changed_when: true

    - name: Wait for the calico-node rollout to complete
      ansible.builtin.command:
        argv:
          - microk8s
          - kubectl
          - --namespace
          - kube-system
          - rollout
          - status
          - daemonset/calico-node
          - --timeout=600s
      changed_when: false
